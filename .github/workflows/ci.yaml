name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install quality-check dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
          python -m pip install pytest==8.3.3 Pillow==11.0.0 scikit-learn==1.5.2 numpy==2.1.3 PyYAML==6.0.2 ruff==0.8.0 black==24.10.0 pytorch-grad-cam==1.5.4 streamlit==1.67.0
      - name: Lint
        run: python -m ruff check src tests
      - name: Check formatting
        run: python -m black --check src tests
      - name: Test
        run: python -m pytest
