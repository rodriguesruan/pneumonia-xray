seed: 42
paths:
  data_root: data/raw/chest_xray
  audit_manifest: reports/data_audit/dataset_manifest.csv
  split_manifest: data/processed/splits.csv
image:
  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
labels:
  NORMAL: 0
  PNEUMONIA: 1
loader:
  batch_size: 32
  num_workers: 0 # Safe default for Windows; tune only after local validation.
  pin_memory: true
split:
  strategy: auto_guard
  validation_fraction: 0.15
  test_fraction: 0.15
augmentation:
  rotation_degrees: 10
  translation_fraction: [0.1, 0.1]
  scale_range: [0.9, 1.1]
  brightness: 0.1
  contrast: 0.1
  horizontal_flip_probability: 0.0
